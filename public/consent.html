<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/flowid.css">
<script>try{var t=localStorage.getItem("flowid-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Разрешить доступ — FlowID</title>
</head>
<body>
<div class="consent enter" id="shell">
  <div class="spread">
    <a class="mark" href="/"><svg class="mark__glyph" viewBox="15 18 131 147" fill="currentColor" aria-hidden="true"><path d="M139 23C142 26 140 34 136 40C131 48 123 53 113 55H59C51 56 46 60 44 66C43 71 44 78 46 86L22 103C20 103 19 102 19 99V67C19 53 25 42 34 34C42 26 50 23 59 22H136C137 22 138 22 139 23Z"/><path d="M119 76C122 79 120 86 116 94C112 101 106 105 97 109L67 116C56 119 49 125 47 134C45 144 40 153 33 157C27 161 21 160 19 157V120C19 111 23 105 31 100C41 94 57 87 74 82L114 74C116 74 118 75 119 76Z"/></svg>FlowID</a>
    <button class="theme-toggle" type="button" aria-label="Переключить тему">
      <svg class="sun" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="3.6"/><path d="M10 2v2m0 12v2M2 10h2m12 0h2M4.6 4.6l1.4 1.4m8 8 1.4 1.4m0-10.8-1.4 1.4m-8 8-1.4 1.4"/></svg>
      <svg class="moon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 11.4A6.6 6.6 0 0 1 8.6 4a6.6 6.6 0 1 0 7.4 7.4Z"/></svg>
    </button>
  </div>

  <div class="panel stack" id="card" aria-busy="true">
    <p class="muted">Загружаем запрос…</p>
  </div>
</div>

<template id="tpl">
  <div class="consent__app">
    <div class="avatar avatar--lg" data-slot="logo"></div>
    <div>
      <h1 style="font-size:23px" data-slot="title"></h1>
      <p class="muted small" data-slot="subtitle"></p>
    </div>
  </div>

  <div class="consent__handshake" aria-hidden="true">
    <span class="mono small muted" data-slot="app-name"></span>
    <span class="dot dot--on"></span><span class="dot"></span><span class="dot"></span>
    <span class="mono small muted">FlowID</span>
  </div>

  <div class="scopes" data-slot="scopes"></div>

  <div class="note" data-slot="account"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="3"/><path d="M4 17c1.4-2.7 3.4-4 6-4s4.6 1.3 6 4"/></svg><span data-slot="account-text"></span></div>

  <div class="stack" style="gap:10px">
    <button class="btn btn--lg btn--block" data-slot="allow">Разрешить доступ</button>
    <button class="btn btn--ghost btn--block" data-slot="deny">Отклонить</button>
  </div>

  <p class="small muted" data-slot="redirect"></p>
</template>

<script type="module">
  import { api, $, $$, toast, busy, initials } from '/assets/js/core.js';

  const card = $('#card');
  const requestId = new URLSearchParams(location.search).get('request');

  function fail(message) {
    card.removeAttribute('aria-busy');
    card.innerHTML = '';
    const title = document.createElement('h1');
    title.style.fontSize = '23px';
    title.textContent = 'Запрос не открылся';
    const text = document.createElement('p');
    text.className = 'muted';
    text.textContent = message;
    const link = document.createElement('a');
    link.className = 'btn btn--ghost';
    link.href = '/account';
    link.textContent = 'В личный кабинет';
    card.append(title, text, link);
  }

  if (!requestId) fail('В адресе нет идентификатора запроса. Вернитесь в приложение и начните вход заново.');

  let data;
  try {
    data = await api(`/api/oauth/consent?request=${encodeURIComponent(requestId)}`);
  } catch (error) {
    if (error.status === 401) location.href = `/login?next=${encodeURIComponent(location.pathname + location.search)}`;
    else fail(error.message);
  }

  if (data) {
    card.removeAttribute('aria-busy');
    card.innerHTML = '';
    card.append($('#tpl').content.cloneNode(true));

    const slot = (name) => card.querySelector(`[data-slot='${name}']`);

    slot('title').textContent = `${data.client.name} запрашивает доступ`;
    slot('subtitle').textContent = data.client.description || 'Приложение подключено к FlowID';
    slot('app-name').textContent = data.client.name;

    if (data.client.logo_url) {
      const img = document.createElement('img');
      img.src = data.client.logo_url;
      img.alt = '';
      slot('logo').append(img);
    } else {
      slot('logo').textContent = initials(data.client.name);
    }

    const scopeBox = slot('scopes');
    for (const scope of data.scopes) {
      const row = document.createElement('label');
      row.className = 'scope';

      let control;
      if (scope.required) {
        control = document.createElement('span');
        control.innerHTML = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 8 14.5l8-9"/></svg>';
        control = control.firstElementChild;
      } else {
        control = document.createElement('input');
        control.type = 'checkbox';
        control.value = scope.key;
        control.checked = true;
      }

      const text = document.createElement('span');
      const title = document.createElement('span');
      title.className = 'scope__title';
      title.textContent = scope.title;
      text.append(title);
      const hint = document.createElement('span');
      hint.className = 'field__hint';
      hint.style.display = 'block';
      hint.textContent = scope.required ? 'нужно приложению обязательно'
        : scope.already_granted ? 'вы уже разрешали это раньше' : '';
      if (hint.textContent) text.append(hint);

      const tag = document.createElement('span');
      tag.className = 'tag mono';
      tag.textContent = scope.key;

      row.append(control, text, tag);
      scopeBox.append(row);
    }

    slot('account-text').textContent = `Вы вошли как ${data.user.name}${data.user.email ? ` · ${data.user.email}` : ''}. Сменить аккаунт можно после выхода.`;
    slot('redirect').textContent = `После подтверждения вы вернётесь на ${data.redirect_host}.`;

    const dots = $$('.consent__handshake .dot', card);
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    const decide = async (allow, button) => {
      busy(button, true, allow ? 'Разрешаем…' : 'Отклоняем…');
      try {
        const scopes = $$('.scope input:checked', card).map((input) => input.value);
        const result = await api('/api/oauth/consent', { method: 'POST', body: { request: requestId, allow, scopes } });

        if (allow && !reducedMotion) {
          // Рукопожатие достраивается — видно, что запрос ушёл обратно в приложение.
          for (const dot of dots.slice(1)) {
            dot.classList.add('dot--on');
            await wait(110);
          }
          card.classList.add('panel--leaving');
          await wait(260);
        }
        // Сервер отдаёт только проверенные адреса; это вторая линия защиты.
        if (/^\s*(javascript|data|vbscript):/i.test(result.redirect)) throw new Error('Приложение указало недопустимый адрес возврата');
        location.href = result.redirect;
      } catch (error) {
        busy(button, false);
        toast(error.message, 'error');
      }
    };

    slot('allow').addEventListener('click', (event) => decide(true, event.currentTarget));
    slot('deny').addEventListener('click', (event) => decide(false, event.currentTarget));
  }
</script>
</body>
</html>
