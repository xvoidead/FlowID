<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/flowid.css">
<script>try{var t=localStorage.getItem("flowid-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Новый пароль — FlowID</title>
</head>
<body>
<div class="consent">
  <a class="mark" href="/"><svg class="mark__glyph" viewBox="15 18 131 147" fill="currentColor" aria-hidden="true"><path d="M139 23C142 26 140 34 136 40C131 48 123 53 113 55H59C51 56 46 60 44 66C43 71 44 78 46 86L22 103C20 103 19 102 19 99V67C19 53 25 42 34 34C42 26 50 23 59 22H136C137 22 138 22 139 23Z"/><path d="M119 76C122 79 120 86 116 94C112 101 106 105 97 109L67 116C56 119 49 125 47 134C45 144 40 153 33 157C27 161 21 160 19 157V120C19 111 23 105 31 100C41 94 57 87 74 82L114 74C116 74 118 75 119 76Z"/></svg>FlowID</a>
  <div class="panel stack">
    <div class="auth__head">
      <h1 style="font-size:26px">Новый пароль</h1>
      <p class="muted">После смены все остальные сессии завершатся — на других устройствах придётся войти заново.</p>
    </div>
    <div class="note note--error" id="note" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="8"/><path d="M10 6v5m0 3h.01"/></svg><span></span></div>
    <form id="form" novalidate>
      <div class="stack">
        <div class="field" data-field="password">
          <label for="password">Пароль</label>
          <div class="input-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="Минимум 8 символов" required autofocus>
            <button class="peek" type="button" aria-label="Показать пароль"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M1.8 10S4.8 4.6 10 4.6 18.2 10 18.2 10 15.2 15.4 10 15.4 1.8 10 1.8 10Z"/><circle cx="10" cy="10" r="2.4"/></svg></button>
          </div>
          <div class="strength" id="strength" data-score="0"><div class="strength__bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div><p class="strength__label"></p></div>
          <p class="field__error"></p>
        </div>
        <button class="btn btn--lg btn--block" type="submit">Сохранить пароль</button>
      </div>
    </form>
  </div>
</div>
<script type="module">
  import { api, $, onSubmit, wirePeek, wireStrength, showNote } from '/assets/js/core.js';
  wirePeek();
  wireStrength($('#password'), $('#strength'));
  const note = $('#note');
  const token = new URLSearchParams(location.search).get('token');
  if (!token) {
    showNote(note, 'В ссылке нет токена. Запросите восстановление заново.', 'error');
    $('#form').hidden = true;
  }
  onSubmit($('#form'), async (values) => {
    const result = await api('/api/auth/password/reset', { method: 'POST', body: { token, password: values.password } });
    location.href = result.next || '/account';
  }, { note, busyLabel: 'Сохраняем…' });
</script>
</body>
</html>
