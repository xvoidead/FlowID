<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/flowid.css">
<script>try{var t=localStorage.getItem("flowid-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<title>Подтверждение почты — FlowID</title>
</head>
<body>
<div class="consent">
  <a class="mark" href="/"><svg class="mark__glyph" viewBox="15 18 131 147" fill="currentColor" aria-hidden="true"><path d="M139 23C142 26 140 34 136 40C131 48 123 53 113 55H59C51 56 46 60 44 66C43 71 44 78 46 86L22 103C20 103 19 102 19 99V67C19 53 25 42 34 34C42 26 50 23 59 22H136C137 22 138 22 139 23Z"/><path d="M119 76C122 79 120 86 116 94C112 101 106 105 97 109L67 116C56 119 49 125 47 134C45 144 40 153 33 157C27 161 21 160 19 157V120C19 111 23 105 31 100C41 94 57 87 74 82L114 74C116 74 118 75 119 76Z"/></svg>FlowID</a>
  <div class="panel stack" id="card">
    <h1 style="font-size:26px" id="title">Проверяем ссылку</h1>
    <p class="muted" id="text">Секунду.</p>
    <a class="btn" href="/account" id="action" hidden>Перейти в аккаунт</a>
  </div>
</div>
<script type="module">
  import { api, $ } from '/assets/js/core.js';
  const token = new URLSearchParams(location.search).get('token');
  try {
    if (!token) throw new Error('no token');
    const result = await api('/api/auth/verify-email', { method: 'POST', body: { token } });
    $('#title').textContent = 'Почта подтверждена';
    $('#text').textContent = `Адрес ${result.email} теперь подтверждён.`;
  } catch (error) {
    $('#title').textContent = 'Ссылка не сработала';
    $('#text').textContent = error.message || 'Ссылка устарела или уже использована. Запросите новую в личном кабинете.';
  } finally {
    $('#action').hidden = false;
  }
</script>
</body>
</html>
